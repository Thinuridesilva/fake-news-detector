name: Model Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas scikit-learn nltk joblib fastapi pydantic uvicorn

      - name: Download NLTK stopwords
        run: python -c "import nltk; nltk.download('stopwords')"

      - name: Test API health and prediction
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from api import health, predict, PredictRequest
          h = health()
          assert h['status'] == 'ok'
          assert h['baseline_loaded']
          print('Health check passed:', h)
          result = predict(PredictRequest(text='The senate voted to approve the infrastructure bill.'))
          assert result.baseline.label in ['REAL', 'FAKE']
          print('Prediction passed:', result.baseline)
          "

      - name: Check model files exist
        run: |
          test -f models/tfidf_vectorizer.joblib && echo "Vectorizer found"
          test -f models/logreg_model.joblib && echo "Model found"
